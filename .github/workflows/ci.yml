name: Merkle log validation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        target: [native, wasm-gc, js]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'
          cache: false
      - name: Install pinned MoonBit
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location https://cli.moonbitlang.com/install/unix.sh -o /tmp/install-moonbit.sh
          bash /tmp/install-moonbit.sh '0.10.14+7d59c7ec9'
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Verify toolchain
        run: |
          moon version --all
          moonc -v | grep -F 'v0.10.14+7d59c7ec9'
      - run: moon update
      - run: moon fmt --check
      - run: moon check --target ${{ matrix.target }} --deny-warn
      - run: moon build --target ${{ matrix.target }} --deny-warn
      - run: moon test --target ${{ matrix.target }} --deny-warn
      - name: Run memory-only scenario
        run: moon run examples/memory --target ${{ matrix.target }}
      - name: Independent Python and pinned Go comparisons
        run: python tools/verify_reference.py --target ${{ matrix.target }} --go go --out artifacts/reference-${{ matrix.target }}.json
      - name: Clean separate consumer
        run: python tools/verify_consumer.py --target ${{ matrix.target }}
      - name: Actual package archive consumer
        run: python tools/verify_consumer.py --target ${{ matrix.target }} --package --out artifacts/package-consumer-${{ matrix.target }}.json
      - name: Independent compact ranges and interval proofs
        run: python tools/verify_expanded_reference.py --target ${{ matrix.target }} --go go --out artifacts/expanded-${{ matrix.target }}.json
      - name: Native storage workflows crash recovery and scale
        if: matrix.target == 'native'
        run: python tools/verify_storage_cli.py --out artifacts/storage-cli-linux.json
      - name: Audited backup and restore workflows
        if: matrix.target == 'native'
        run: python tools/verify_backup.py --out artifacts/backup-linux.json
      - name: Verify reference provenance and commit history
        run: python tools/check_repository.py
      - name: Reproduce generated Go vectors and public API
        if: matrix.target == 'native'
        run: |
          python tools/generate_go_vectors.py --go go
          moon info
          moon fmt --check
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
      - uses: actions/upload-artifact@v4
        with:
          name: reference-${{ matrix.target }}
          path: |
            artifacts/reference-${{ matrix.target }}.json
            artifacts/expanded-${{ matrix.target }}.json
            artifacts/storage-cli-linux.json
            artifacts/backup-linux.json
            artifacts/package-consumer-${{ matrix.target }}.json
  windows-native:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned MoonBit
        shell: pwsh
        env:
          MOONBIT_INSTALL_VERSION: '0.10.14+7d59c7ec9'
        run: |
          Invoke-WebRequest https://cli.moonbitlang.com/install/powershell.ps1 -OutFile "$env:RUNNER_TEMP/install-moonbit.ps1"
          & "$env:RUNNER_TEMP/install-moonbit.ps1"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "$env:USERPROFILE/.moon/bin" >> $env:GITHUB_PATH
      - name: Verify toolchain
        shell: pwsh
        run: |
          moon version --all
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $compilerVersion = moonc -v
          if ($compilerVersion -notmatch 'v0\.10\.14\+7d59c7ec9') { throw "Unexpected compiler: $compilerVersion" }
      - run: moon update
      - run: moon fmt --check
      - run: moon check --target native --deny-warn
      - run: moon build --target native --deny-warn
      - run: moon test --target native --deny-warn
      - name: Native storage workflows crash recovery and scale
        run: python tools/verify_storage_cli.py --out artifacts/storage-cli-windows.json
      - name: Audited backup and restore workflows
        run: python tools/verify_backup.py --out artifacts/backup-windows.json
      - name: Clean native public API consumer
        run: python tools/verify_consumer.py --target native
      - name: Actual native package archive consumer
        run: python tools/verify_consumer.py --target native --package --out artifacts/package-consumer-windows.json
      - uses: actions/upload-artifact@v4
        with:
          name: windows-native
          path: |
            artifacts/storage-cli-windows.json
            artifacts/backup-windows.json
            artifacts/package-consumer-windows.json
